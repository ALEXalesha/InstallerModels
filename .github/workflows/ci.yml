# Проверки на каждый пуш.
#
# Раннер windows: программа под Windows, окно на Qt, и часть проверок поднимает
# настоящее окно на настоящей платформе Qt - offscreen не знает тем Windows и
# рисует не так. Сеть проверкам не нужна: Hugging Face изображает локальный
# сервер, которому можно велеть рвать соединение и отдавать не тот размер.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Проверки
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: 64 проверки
        run: python tests.py
